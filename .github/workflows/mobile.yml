name: Mobile Android CI

on:
  push:
    branches: [main]
    paths:
      - '06_Appium/**'
      - '.github/workflows/mobile.yml'
  pull_request:
    paths:
      - '06_Appium/**'
      - '.github/workflows/mobile.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANDROID_API_LEVEL: 31
      APP_REPO: saucelabs/my-demo-app-android

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Enable KVM for the Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r 06_Appium/requirements.txt
          npm install -g appium
          appium driver install uiautomator2

      - name: Download app APK (latest release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo "$APP_REPO" --pattern 'mda-[0-9]*.apk' --dir app-build
          mv app-build/*.apk app-build/my-demo-app.apk
          ls -l app-build

      - name: Run pytest and Robot Framework on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.ANDROID_API_LEVEL }}
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: |
            adb install -r "$GITHUB_WORKSPACE/app-build/my-demo-app.apk"
            nohup appium > appium.log 2>&1 &
            sleep 10
            mkdir -p 06_Appium/results
            status=0
            pytest 06_Appium/tests/py -m "not known_defect" || status=1
            robot -d 06_Appium/results/robot -e known-defect 06_Appium/tests/robot || status=1
            exit $status

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: mobile-test-results
          # ผลของ pytest/Robot + screenshot ตอนเทสล้มของ pytest (ผล Maestro อยู่ที่ maestro-ci.yml)
          path: 06_Appium/results/
          retention-days: 30
          if-no-files-found: warn
