name: Playwright Tests

on:
  push:
    paths:
      - '04_Playwright/**'
      - '.github/workflows/playwright.yml'
  pull_request:
    paths:
      - '04_Playwright/**'
      - '.github/workflows/playwright.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: 04_Playwright
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: 04_Playwright/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install Google Chrome
        run: npx playwright install --with-deps chrome
      - name: Run registered Playwright suite
        run: npm test
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: 04_Playwright/playwright-report/
          retention-days: 30
