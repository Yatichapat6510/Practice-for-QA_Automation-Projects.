name: Cypress Tests

on:
  push:
    branches: [main]
    paths:
      - '07_cypress/**'
      - '.github/workflows/cypress.yml'
  pull_request:
    paths:
      - '07_cypress/**'
      - '.github/workflows/cypress.yml'

permissions:
  contents: read

jobs:
  cypress:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Run showcase specs (project-1-sauce-demo)
        uses: cypress-io/github-action@v7
        with:
          working-directory: 07_cypress
          browser: chrome
          spec: cypress/e2e/1-getting-started/**/*.cy.js
      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: cypress-screenshots
          path: 07_cypress/cypress/screenshots
          if-no-files-found: ignore
          retention-days: 14
