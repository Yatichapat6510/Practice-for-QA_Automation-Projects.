name: Robot Framework CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 05_Robot-Framework

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Run Robot Framework tests
        run: xvfb-run --auto-servernum robot -d results tests/

      - name: Summarize failed tests
        if: failure()
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          for test in ET.parse("results/output.xml").getroot().iter("test"):
              status = test.find("status")
              if status is not None and status.get("status") == "FAIL":
                  msg = " ".join((status.text or "").split())[:400]
                  print(f"::error title={test.get('name')}::{msg}")
          PY

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robot-framework-results
          path: 05_Robot-Framework/results/
          if-no-files-found: warn
