#e3-fixed.yaml

appId: org.wikipedia
--- 
- launchApp
- tapOn: "Search Wikipedia"
- inputText: "Appium"
- tapOn:
    text: "Appium"
    index: 1          # ตั้งใจเลือกผลลัพธ์ ไม่ใช่ช่องพิมพ์ (ยืนยันด้วย Studio)
- assertVisible: "Contents"   # ตัวอย่างข้อความที่มีเฉพาะหน้าบทความ ให้ปรับตามแอปจริง
- runFlow:
    when:
      visible: "OK"
    commands:
      - tapOn: "OK"


