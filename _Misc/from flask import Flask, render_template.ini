from flask import Flask, render_template_string, request, redirect, url_for
import sqlite3

app = Flask(__name__)
DB_NAME = "students.db"

# ฟังก์ชันสร้างตารางฐานข้อมูลถ้ายังไม่มี
def init_db():
    conn = sqlite3.connect(DB_NAME)
    cur = conn.cursor()
    cur.execute("""
        CREATE TABLE IF NOT EXISTS students (
            id INTEGER PRIMARY KEY AUTOINCREMENT,
            name TEXT NOT NULL
        )
    """)
    conn.commit()
    conn.close()

# หน้าแรก - แสดงฟอร์มและรายชื่อ
@app.route("/", methods=["GET", "POST"])
def home():
    if request.method == "POST":
        name = request.form.get("name")
        if name:
            conn = sqlite3.connect(DB_NAME)
            cur = conn.cursor()
            cur.execute("INSERT INTO students (name) VALUES (?)", (name,))
            conn.commit()
            conn.close()
        return redirect(url_for("home"))

    conn = sqlite3.connect(DB_NAME)
    cur = conn.cursor()
    cur.execute("SELECT id, name FROM students")
    students = cur.fetchall()
    conn.close()

    return render_template_string("""
        <html>
        <head>
            <title>Student List</title>
        </head>
        <body>
            <h1>ระบบบันทึกรายชื่อ</h1>
            <form method="post">
                <input type="text" name="name" placeholder="กรอกชื่อ" required>
                <button type="submit">บันทึก</button>
            </form>
            <h2>รายชื่อทั้งหมด:</h2>
            <ul>
            {% for s in students %}
                <li>{{ s[1] }}</li>
            {% endfor %}
            </ul>
        </body>
        </html>
    """, students=students) 

if __name__ == "__main__":
    init_db()
    app.run(debug=True)
from flask import Flask, render_template_string, request, redirect, url_for, session
import sqlite3
from werkzeug.security import generate_password_hash, check_password_hash

app = Flask(__name__)
app.secret_key = "secret_key_for_session"  # ใช้สำหรับ session (ควรเปลี่ยนเป็นค่าอื่นในโปรดักชัน)
DB_NAME = "users.db"

# ฟังก์ชันสร้างตารางฐานข้อมูล
def init_db():
    conn = sqlite3.connect(DB_NAME)
    cur = conn.cursor()
    cur.execute("""
        CREATE TABLE IF NOT EXISTS users (
            id INTEGER PRIMARY KEY AUTOINCREMENT,
            username TEXT UNIQUE NOT NULL,
            password TEXT NOT NULL
        )
    """)
    conn.commit()
    conn.close()

# 🔹 หน้าแรก (Home)
@app.route("/")
def home():
    if "username" in session:
        return render_template_string("""
            <h1>สวัสดี {{ username }}</h1>
            <p>คุณล็อกอินอยู่แล้ว</p>
            <a href="/logout">ออกจากระบบ</a>
        """, username=session["username"])
    return render_template_string("""
        <h1>ยินดีต้อนรับ</h1>
        <a href="/register">สมัครสมาชิก</a> | <a href="/login">เข้าสู่ระบบ</a>
    """)

# 🔹 สมัครสมาชิก (Register)
@app.route("/register", methods=["GET", "POST"])
def register():
    if request.method == "POST":
        username = request.form.get("username")
        password = request.form.get("password")

        if username and password:
            conn = sqlite3.connect(DB_NAME)
            cur = conn.cursor()
            try:
                cur.execute("INSERT INTO users (username, password) VALUES (?, ?)",
                            (username, generate_password_hash(password)))
                conn.commit()
                conn.close()
                return redirect(url_for("login"))
            except sqlite3.IntegrityError:
                return "❌ ชื่อผู้ใช้นี้ถูกใช้ไปแล้ว"

    return render_template_string("""
        <h1>สมัครสมาชิก</h1>
        <form method="post">
            <input type="text" name="username" placeholder="Username" required><br><br>
            <input type="password" name="password" placeholder="Password" required><br><br>
            <button type="submit">สมัคร</button>
        </form>
        <a href="/">กลับหน้าแรก</a>
    """)

# 🔹 เข้าสู่ระบบ (Login)
@app.route("/login", methods=["GET", "POST"])
def login():
    if request.method == "POST":
        username = request.form.get("username")
        password = request.form.get("password")

        conn = sqlite3.connect(DB_NAME)
        cur = conn.cursor()
        cur.execute("SELECT * FROM users WHERE username = ?", (username,))
        user = cur.fetchone()
        conn.close()

        if user and check_password_hash(user[2], password):
            session["username"] = username
            return redirect(url_for("home"))
        else:
            return "❌ ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง"

    return render_template_string("""
        <h1>เข้าสู่ระบบ</h1>
        <form method="post">
            <input type="text" name="username" placeholder="Username" required><br><br>
            <input type="password" name="password" placeholder="Password" required><br><br>
            <button type="submit">เข้าสู่ระบบ</button>
        </form>
        <a href="/">กลับหน้าแรก</a>
    """)

# 🔹 ออกจากระบบ (Logout)
@app.route("/logout")
def logout():
    session.pop("username", None)
    return redirect(url_for("home"))

if __name__ == "__main__":
    init_db()
    app.run(debug=True)
